<text x="576.0" y="630.0" font-size="12.5" fill="#333" text-anchor="start" font-weight="normal" font-style="">· 同一世界点 P，不同 θ 下的测距 r(θ) 不同</text>
<text x="576.0" y="652.0" font-size="12.5" fill="#333" text-anchor="start" font-weight="normal" font-style="">  （0° 与 90° 差约 23cm），必须补偿</text>
<text x="576.0" y="674.0" font-size="12.5" fill="#333" text-anchor="start" font-weight="normal" font-style="">· d 沿雷达轴度量：x 前向、z 右向，转盘转动时随雷达一起转</text>

<rect x="470.0" y="640.0" width="500.0" height="92.0" rx="8" fill="#fdf0ef" stroke="#e3b9b5" opacity="1.0"/>
<text x="486.0" y="664.0" font-size="13" fill="#34495e" text-anchor="start" font-weight="bold" font-style="">推导：</text>
<text x="486.0" y="686.0" font-size="12" fill="#333" text-anchor="start" font-weight="normal" font-style="">P′ = Rz(θ)·T·(p − d) = Rz(θ)·T·p − Rz(θ)·T·d</text>
<text x="486.0" y="706.0" font-size="12" fill="#333" text-anchor="start" font-weight="normal" font-style="">   = P − 2·Rz(θ)·T·d   →  θ 变，P′ 绕 P 转圈</text>
<text x="486.0" y="726.0" font-size="12" fill="#c0392b" text-anchor="start" font-weight="normal" font-style="">每帧同一点被放到圆上不同位置 → 拼接后变圆环</text>
<text x="30.0" y="735.0" font-size="13" fill="#333" text-anchor="start" font-weight="normal" font-style="">竖直方向高度不变 → 3D 中每个原始点都糊成水平圆环，点云呈现“各圆柱面”漂移（见下页）。</text>
</svg>
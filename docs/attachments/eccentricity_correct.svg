<path d="M 878.1 411.1 L 702.2 284.8 L 714.4 501.0 L 875.0 355.7 L 661.1 322.1 L 769.3 509.6 L 847.3 307.6 L 641.1 373.9 L 822.1 492.7 L 800.8 277.2 L 646.5 429.1 L 861.7 453.7 L 745.7 270.9 L 676.3 476.0 L 879.5 401.1 L 693.6 290.0 L 723.9 504.5 L 871.7 346.2 L 655.7 330.6 L 779.3 508.4 L 840.0 300.6 L 640.2 383.9 L 830.5 487.1 L 791.2 274.1 L 650.2 438.5 L 866.7 444.9 L 735.7 272.5 L 683.8 482.7 L 880.0 391.1 L 685.4 296.0 L 733.7 507.1 L 867.6 336.9 L 651.1 339.6 L 789.2 506.4 L 832.2 294.2 L 640.1 394.0 L 838.4 480.8 L 781.4 271.9 L 654.7 447.5 L 870.9 435.8 L 726.0 274.9" stroke="#8e44ad" stroke-width="2.5" fill="none"/>

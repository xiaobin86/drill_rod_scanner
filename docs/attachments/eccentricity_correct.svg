<text x="1054.0" y="372.0" font-size="13.5" fill="#27ae60" text-anchor="start" font-weight="bold" font-style="">= P ✓</text>
<rect x="30.0" y="660.0" width="1060.0" height="58.0" rx="8" fill="#f0f7f0" stroke="#bcd8bc" opacity="1.0"/>
<text x="46.0" y="686.0" font-size="13" fill="#333" text-anchor="start" font-weight="normal" font-style="">关键：d = (offset_x, offset_z) 在雷达系中是常量，不随转盘旋转；</text>
<text x="46.0" y="706.0" font-size="13" fill="#333" text-anchor="start" font-weight="normal" font-style="">p 与 d 在雷达系内相加（一步到位），旋转只发生在最后一步。</text>
</svg>
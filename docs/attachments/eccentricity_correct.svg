<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="740" viewBox="0 0 1120 740" font-family="'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">
<text x="24.0" y="34.0" font-size="19" fill="#34495e" text-anchor="start" font-weight="bold" font-style="">图 2 · 正确公式：P = Rz(θ)·T·(p + d)  ——  先加 d，再旋转</text>
<text x="24.0" y="56.0" font-size="12.5" fill="#7f8c8d" text-anchor="start" font-weight="normal" font-style="">左：θ=0°（雷达系=世界系）可直观看到 p+d=P；右：θ=90° 一般情形（d 为雷达系常量）</text>
<text x="230.0" y="60.0" font-size="15" fill="#34495e" text-anchor="middle" font-weight="bold" font-style="">θ = 0°：Rz = I，雷达系 = 世界系</text>
